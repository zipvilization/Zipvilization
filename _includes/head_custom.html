<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">

<link rel="preload"
      as="image"
      href="{{ '/assets/images/zipvilization-logo.png' | relative_url }}">

<!--
  Zipvilization structured data layer.

  This block complements the metadata generated by Just the Docs /
  jekyll-seo-tag. It does not replace the project Canon.

  Markdown remains the authoritative documentary source.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": "{{ page.url | absolute_url }}#webpage",
  "url": "{{ page.url | absolute_url }}",
  "name": {{ page.title | default: site.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "inLanguage": {{ site.lang | default: "en" | jsonify }},
  "isPartOf": {
    "@type": "WebSite",
    "@id": "{{ '/' | absolute_url }}#website",
    "url": "{{ '/' | absolute_url }}",
    "name": {{ site.title | jsonify }},
    "description": {{ site.description | jsonify }},
    "inLanguage": {{ site.lang | default: "en" | jsonify }}
  },
  "about": {
    "@type": "Thing",
    "@id": "{{ '/' | absolute_url }}#zipvilization",
    "name": "Zipvilization",
    "description": {{ site.description | jsonify }},
    "url": "{{ '/' | absolute_url }}"
  }
}
</script>
